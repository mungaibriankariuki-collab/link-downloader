<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Link Downloader</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #0a0a0f; color: #e0e0e8; min-height: 100vh; padding: 20px; }
    .container { max-width: 860px; margin: 0 auto; }
    h1 { margin-bottom: 20px; font-size: 1.8rem; background: linear-gradient(135deg, #ff6b6b, #ee5a24); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .panel { background: #16161f; border-radius: 8px; padding: 20px; margin-bottom: 20px; border: 1px solid #333; }
    .panel h2 { margin-bottom: 15px; color: #ff6b6b; font-size: 1.2rem; border-bottom: 1px solid #333; padding-bottom: 10px; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 6px; color: #888; font-size: 0.85rem; }
    .form-group input { width: 100%; padding: 10px; background: #0d0d14; border: 1px solid #333; border-radius: 4px; color: #e0e0e8; font-size: 0.95rem; }
    .form-group input:focus { outline: none; border-color: #ff6b6b; }
    .row { display: flex; gap: 10px; }
    .row input { flex: 1; }
    .btn { padding: 10px 20px; background: linear-gradient(135deg, #ff6b6b, #ee5a24); color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 0.95rem; transition: opacity 0.2s; white-space: nowrap; }
    .btn:hover { opacity: 0.9; }
    .btn:disabled { background: #555; cursor: not-allowed; opacity: 1; }
    .btn-secondary { background: #333; }
    .btn-secondary:hover { background: #444; }
    .btn-small { padding: 6px 12px; font-size: 0.8rem; border-radius: 4px; border: none; cursor: pointer; }
    .btn-cancel { background: #7a2c2c; color: #ffd7d7; }
    .btn-cancel:hover { background: #993a3a; }
    .btn-open { background: #1f4d3a; color: #b9f5d8; }
    .btn-open:hover { background: #2a6b52; }
    .status { padding: 10px; background: #1a1a24; border-radius: 4px; margin: 10px 0; border-left: 4px solid; font-size: 0.9rem; display: none; }
    .status.visible { display: block; }
    .status.success { border-left-color: #4ade80; background: #1e3a24; }
    .status.error { border-left-color: #f87171; background: #3a1e1e; }
    .status.info { border-left-color: #63b3ed; background: #1e2a3a; }
    .queue:empty::after { content: 'No downloads yet.'; display: block; color: #555; font-size: 0.85rem; text-align: center; padding: 20px 0; }
    .queue-item { background: #0d0d14; border: 1px solid #2a2a35; border-radius: 6px; padding: 12px 14px; margin-bottom: 10px; }
    .queue-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 8px; }
    .queue-name { font-size: 0.9rem; font-weight: 600; color: #cdd0da; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .queue-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 700; }
    .badge.queued { background: #2a2a3a; color: #9aa0b5; }
    .badge.downloading { background: #1e2a3a; color: #63b3ed; }
    .badge.done { background: #1e3a24; color: #4ade80; }
    .badge.failed { background: #3a1e1e; color: #f87171; }
    .badge.cancelled { background: #332b1e; color: #e0b55e; }
    .badge.video { background: #3a1a1a; color: #ff8585; }
    .badge.music { background: #3a1e2c; color: #ff8fb8; }
    .badge.image { background: #3a341a; color: #e8d76b; }
    .badge.apk { background: #2b1e3a; color: #b58cff; }
    .badge.file { background: #22303a; color: #7fc4e8; }
    .progress-bar { width: 100%; height: 6px; background: #23232e; border-radius: 3px; overflow: hidden; }
    .progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #ff6b6b, #ee5a24); transition: width 0.15s linear; }
    .queue-meta { display: flex; justify-content: space-between; font-size: 0.75rem; color: #777; margin-top: 6px; }
    .hint { font-size: 0.75rem; color: #555; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Link Downloader</h1>

    <div class="panel">
      <h2>Add a Download</h2>
      <div class="form-group">
        <label>Media URL</label>
        <input type="url" id="urlInput" placeholder="https://example.com/video.mp4" spellcheck="false">
      </div>
      <div class="form-group">
        <label>Save to</label>
        <div class="row">
          <input type="text" id="folderInput" placeholder="Choose a folder..." readonly>
          <button class="btn btn-secondary" id="chooseFolderBtn">Browse</button>
        </div>
      </div>
      <button class="btn" id="addBtn" style="width: 100%;">Start Download</button>
      <div class="hint">Supports direct media links (video, audio, image, APK). DRM-protected and login-walled content is not supported.</div>
      <div id="statusBar" class="status"></div>
    </div>

    <div class="panel">
      <h2>Downloads</h2>
      <div id="queue" class="queue"></div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
